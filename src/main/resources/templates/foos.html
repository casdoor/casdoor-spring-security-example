<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <title>Casdoor Spring Security Example</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.3/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm p-3 mb-5">
    <a class="navbar-brand" th:href="@{/}">Casdoor Spring Security Example</a>
    <ul class="navbar-nav ml-auto">
        <li class="navbar-text">Hi, <span sec:authentication="name">user</span></li>
    </ul>
</nav>
<div class="container">
    <h1>All Foos:</h1>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <td>ID</td>
            <td>Name</td>
        </tr>
        </thead>
        <tbody>
        <tr th:each="foo : ${foos}">
            <td th:text="${foo.id}">ID</td>
            <td th:text="${foo.name}">Name</td>
        </tr>
        </tbody>
    </table>

    <h2>You</h2>
    <table class="table table-bordered">
        <tr>
            <td>Name</td>
            <td th:text="${user.name}">name</td>
        </tr>
        <tr>
            <td>Email</td>
            <td th:text="${user.email}">email</td>
        </tr>
        <tr>
            <td>Authorities</td>
            <td th:text="${user.authorities}">authorities</td>
        </tr>
    </table>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger">Logout</button>
    </form>
</div>
</body>
</html>
